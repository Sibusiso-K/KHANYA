[pytest]
# Without this, `pytest tests/ -q` (no `-m`, exactly what CI runs) fails every
# test that imports `src.*` or `dashboard.*` with ModuleNotFoundError - the
# repo root is never on sys.path unless pytest is invoked as `python -m
# pytest`, which inserts cwd automatically. `pythonpath` puts the repo root on
# sys.path regardless of invocation style. Found 2026-09-13: CI has been
# failing on every push since at least 2026-09-05 and nobody had noticed,
# because everyone's local runs used `python -m pytest`.
pythonpath = .
